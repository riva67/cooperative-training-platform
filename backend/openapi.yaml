      tags: [Supervision]
      summary: The evaluation form of one trainee
      description: "✅ **Implemented**. ACADEMIC_SUPERVISOR / ORG_SUPERVISOR of that assignment, or ADMIN. 404 if not evaluated yet."
      parameters:
        - name: assignmentId
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Evaluation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Evaluation' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /final-grades:
    post:
      tags: [Supervision]
      summary: Set the final grade
      description: |
        ✅ **Implemented**. **ACADEMIC_SUPERVISOR** of that assignment, or ADMIN.
        Also marks the assignment `COMPLETED` and notifies the student. 409 if a grade already exists.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [assignmentId, grade]
              properties:
                assignmentId: { type: integer }
                grade: { type: number, minimum: 0, maximum: 100 }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FinalGrade' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: Final grade already exists
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /final-grades/{assignmentId}:
    get:
      tags: [Supervision]
      summary: Get the final grade of an assignment
      description: "✅ **Implemented**. The student, their supervisors, or ADMIN."
      parameters:
        - name: assignmentId
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Final grade
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FinalGrade' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /visits:
    post:
      tags: [Visits]
      summary: Book a field visit
      description: |
        ✅ **Implemented**. **ACADEMIC_SUPERVISOR only.** Picks the organization supervisor (`orgSupervisorId`) and a date + time (`scheduledAt`, ISO 8601, in the future).
        You can only book with a supervisor who has an ACTIVE trainee of yours (403). Visits are 1 hour long: an overlapping PENDING/APPROVED visit for either side returns 409.
        If `message` is omitted, a polite Arabic request message is generated. The organization supervisor is notified and answers via `/visits/{id}/respond`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [orgSupervisorId, scheduledAt]
              properties:
                orgSupervisorId: { type: integer, description: "Organization supervisor profile ID (not the user ID)" }
                scheduledAt: { type: string, format: date-time, example: '2026-10-20T07:00:00.000Z' }
                message: { type: string, maxLength: 1000 }
      responses:
        '201':
          description: Created with status PENDING
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FieldVisit' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Overlapping visit
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    get:
      tags: [Visits]
      summary: Field visits table (الزيارات الميدانية)
      description: |
        ✅ **Implemented**. ACADEMIC_SUPERVISOR sees their visits; ORG_SUPERVISOR sees the requests sent to them; ADMIN sees all.
        Call it twice to fill the two tables: `?when=upcoming` (soonest first) and `?when=past` (latest first).
        Each row carries everything the table needs: organization name, supervisor name, supervisor phone, visit date, `isDone` and `notes`.
      parameters:
        - name: when
          in: query
          schema: { type: string, enum: [upcoming, past] }
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/VisitStatus' }
        - name: isDone
          in: query
          schema: { type: boolean }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Paginated visits
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/FieldVisit' }
                  total: { type: integer }
                  page: { type: integer }
                  pages: { type: integer }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /visits/{id}:
    patch:
      tags: [Visits]
      summary: Tick "Done" and/or write notes
      description: |
        ✅ **Implemented**. **ACADEMIC_SUPERVISOR** who owns the visit (or ADMIN). Send `isDone` and/or `notes`.
        `isDone: true` is only allowed on an APPROVED visit whose date has arrived (400 otherwise). `isDone: false` un-ticks it.
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                isDone: { type: boolean }
                notes: { type: string, nullable: true, maxLength: 2000 }
      responses:
        '200':
          description: Updated visit
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FieldVisit' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /visits/{id}/respond:
    patch:
      tags: [Visits]
      summary: Approve or decline a visit request
      description: |
        ✅ **Implemented**. **ORG_SUPERVISOR** the request was sent to (or ADMIN). Only a PENDING request whose time has not passed.
        If `message` is omitted a default Arabic reply is used (approve: «الوقت مناسب جداً ونتطلع للقائكم قريباً.»). The academic supervisor is notified.
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision: { type: string, enum: [APPROVE, DECLINE] }
                message: { type: string, maxLength: 1000 }
      responses:
        '200':
          description: Updated visit (status APPROVED or DECLINED)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FieldVisit' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /visits/{id}/cancel:
    patch:
      tags: [Visits]
      summary: Cancel a visit
      description: "✅ **Implemented**. **ACADEMIC_SUPERVISOR** who owns it (or ADMIN). Only PENDING/APPROVED visits that are not done. The organization supervisor is notified."
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Visit with status CANCELLED
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FieldVisit' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /messages/contacts:
    get:
      tags: [Messages]
      summary: People I can message
      description: |
        ✅ **Implemented**. Academic supervisor: their students and organization supervisors. Student and organization supervisor: their academic supervisor(s). ADMIN: everyone.
        Use it to fill the "recipient" list.
      responses:
        '200':
          description: Contacts
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Contact' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /messages/unread-count:
    get:
      tags: [Messages]
      summary: Number of unread messages (badge)
      description: "✅ **Implemented**. Poll this every ~15–30 seconds."
      responses:
        '200':
          description: Count
          content:
            application/json:
              schema:
                type: object
                properties:
                  count: { type: integer }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /messages/conversations:
    get:
      tags: [Messages]
      summary: Inbox (one row per person)
      description: "✅ **Implemented**. Newest conversation first, with the last message and the unread count."
      responses:
        '200':
          description: Conversations
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Conversation' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /messages/with/{userId}:
    get:
      tags: [Messages]
      summary: Open a conversation
      description: |
        ✅ **Implemented**. Messages between me and `userId`, **oldest first**. Opening it marks their messages to me as read.
        For older messages pass `before` = the smallest message id you already have. 403 if you are not allowed to message that user.
        For live chat, poll this endpoint every few seconds.
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: integer }
        - name: before
          in: query
          schema: { type: integer }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        '200':
          description: Messages
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Message' }
                  hasMore: { type: boolean }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /messages:
    post:
      tags: [Messages]
      summary: Send a message (chat line or email-style)
      description: |
        ✅ **Implemented**. A chat line is just `body`. For an email-style message add `subject` and/or `attachmentId` (upload the file first with `POST /attachments`; you can only attach your own uploads).
        Allowed pairs: academic supervisor ↔ their students, academic supervisor ↔ their organization supervisors (403 otherwise).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [recipientId, body]
              properties:
                recipientId: { type: integer, description: "User ID" }
                subject: { type: string, maxLength: 200 }
                body: { type: string, maxLength: 5000 }
                attachmentId: { type: integer }
      responses:
        '201':
          description: Sent
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Message' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /messages/broadcast:
    post:
      tags: [Messages]
      summary: Send one message (e.g. a form) to all my students and/or organizations
      description: "✅ **Implemented**. **ACADEMIC_SUPERVISOR only.** Goes to everyone linked to their ACTIVE assignments; each recipient gets their own copy."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [audience, subject, body]
              properties:
                audience: { type: string, enum: [MY_STUDENTS, MY_ORGANIZATIONS, BOTH] }
                subject: { type: string, maxLength: 200 }
                body: { type: string, maxLength: 5000 }
                attachmentId: { type: integer }
      responses:
        '201':
          description: Sent
          content:
            application/json:
              schema:
                type: object
                properties:
                  sent: { type: integer, description: Number of recipients }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /attachments:
    post:
      tags: [Messages]
      summary: Upload a file to attach to a message
      description: "✅ **Implemented**. `multipart/form-data` with one field named `file`. Max 10 MB. Allowed: PDF, Word, Excel, PowerPoint, PNG, JPG, TXT (400 otherwise, 413 if too large)."
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        '201':
          description: Uploaded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Attachment' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '413':
          description: File too large
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /attachments/{id}:
    get:
      tags: [Messages]
      summary: Download an attachment
      description: "✅ **Implemented**. The uploader, the sender/recipient of a message that carries it, or ADMIN. Send the Bearer token (fetch the file as a blob; a plain link will not carry it)."
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: The file
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /notifications:
    get:
      tags: [Notifications]
      summary: My notifications
      description: "✅ **Implemented**. Any logged-in user. Newest first."
      parameters:
        - name: unread
          in: query
          description: Set to `true` to return only unread
          schema: { type: boolean }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Paginated notifications plus unread count (for the bell badge)
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Notification' }
                  unreadCount: { type: integer }
                  total: { type: integer }
                  page: { type: integer }
                  pages: { type: integer }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /notifications/{id}/read:
    patch:
      tags: [Notifications]
      summary: Mark one notification as read
      description: "✅ **Implemented**. Only the owner."
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Notification' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /notifications/read-all:
    patch:
      tags: [Notifications]
      summary: Mark all my notifications as read
      description: "✅ **Implemented**."
      responses:
        '200':
          description: Done
          content:
            application/json:
              schema:
                type: object
                properties:
                  updated: { type: integer }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /stats/summary:
    get:
      tags: [Statistics]
      summary: Impact indicators
      description: "✅ **Implemented**. **ADMIN or ACADEMIC_SUPERVISOR.** Feeds the dashboard and the project's impact indicators."
      responses:
        '200':
          description: Summary numbers
          content:
            application/json:
              schema:
                type: object
                properties:
                  totalOpportunities: { type: integer, description: "Impact indicator: عدد فرص التدريب" }
                  completionRate: { type: number, example: 78.5, description: "Impact indicator: نسبة إكمال التدريب (percent of assignments that are COMPLETED)" }
                  providerSatisfaction: { type: number, nullable: true, example: 4.2, description: "Impact indicator: رضا جهات التدريب — average `satisfaction` (1..5) from the evaluation forms" }
                  providerSatisfactionRate: { type: number, nullable: true, example: 80, description: Same as a percent (1 = 0%, 5 = 100%) }
                  providerSatisfactionResponses: { type: integer }
                  employmentRate: { type: number, nullable: true, example: 40, description: "Impact indicator: نسبة التوظيف بعد التدريب — percent of completed trainees who reported a job (PATCH /assignments/{id}/employment)" }
                  employmentResponses: { type: integer }
                  openOpportunities: { type: integer }
                  organizationsByType: { type: object, additionalProperties: { type: integer }, example: { PRIVATE: 5, GOVERNMENT: 2 } }
                  totalApplications: { type: integer }
                  activeAssignments: { type: integer }
                  completedAssignments: { type: integer }
                  averageFinalGrade: { type: number, nullable: true }
                  wouldHireRate: { type: number, nullable: true, example: 82.5, description: "Percent of evaluations where the organization WANTS to hire the trainee (intention; see employmentRate for real jobs)" }
                  averageAttendanceRate: { type: number, nullable: true }
                  averageEvaluationScore: { type: number, nullable: true, example: 33.5, description: "Average organization evaluation of trainees, out of 40" }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /logs:
    get:
      tags: [System]
      summary: Audit logs
      description: "✅ **Implemented**. **ADMIN only.** Newest first."
      parameters:
        - name: userId
          in: query
          schema: { type: integer }
        - name: action
          in: query
          schema: { type: string, example: USER_CREATED }
        - name: entity
          in: query
          schema: { type: string, example: User }
        - name: from
          in: query
          description: Only logs created at or after this date/time
          schema: { type: string, format: date-time }
        - name: to
          in: query
          description: Only logs created at or before this date/time
          schema: { type: string, format: date-time }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Paginated logs
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/AuditLog' }
                  total: { type: integer }
                  page: { type: integer }
                  pages: { type: integer }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: integer }
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }

  responses:
    Unauthorized:
      description: Missing, invalid or expired token
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: Your role is not allowed to do this
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Record not found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ValidationError:
      description: Invalid input
      content:
        application/json:
          schema:
            type: object
            properties:
              error: { type: string, example: Validation failed }
              details:
                type: array
                items:
                  type: object
                  properties:
                    field: { type: string, example: email }
                    message: { type: string, example: Invalid email }

  schemas:
    Error:
      type: object
      properties:
        error: { type: string }

    Role:
      type: string
      enum: [STUDENT, ACADEMIC_SUPERVISOR, ORG_SUPERVISOR, ADMIN]
    OpportunityStatus:
      type: string
      enum: [OPEN, CLOSED]
    ApplicationStatus:
      type: string
      enum: [PENDING, NOMINATED, APPROVED, REJECTED]
    AssignmentStatus:
      type: string
      enum: [ACTIVE, COMPLETED, CANCELLED]
    AttendanceStatus:
      type: string
      enum: [PRESENT, ABSENT, LATE, EXCUSED]
    ReportType:
      type: string
      enum: [WEEKLY, FINAL, APPROVAL, ABSENCE_WARNING, VISIT]
      description: "Student: WEEKLY, FINAL. Training provider: APPROVAL, ABSENCE_WARNING (إنذار غياب), VISIT (تقرير زيارة)"
    AccountStatus:
      type: string
      enum: [PENDING, ACTIVE, REJECTED, SUSPENDED]
    OrganizationType:
      type: string
      enum: [PRIVATE, EDUCATIONAL, GOVERNMENT]
      description: "منشأة / تعليمية / حكومية"
    OpportunityType:
      type: string
      enum: [COOP, SUMMER]
      description: "تدريب تعاوني / تدريب صيفي"
    ReportStatus:
      type: string
      enum: [DRAFT, SUBMITTED, APPROVED, REJECTED]

    AuthUser:
      type: object
      properties:
        id: { type: integer, example: 1 }
        name: { type: string, example: System Admin }
        email: { type: string, example: admin@coop.test }
        role: { $ref: '#/components/schemas/Role' }
        status: { $ref: '#/components/schemas/AccountStatus' }
        organization:
          type: object
          nullable: true
          description: Training providers only — use `type` to choose the portal view
          properties:
            id: { type: integer }
            name: { type: string }
            type: { $ref: '#/components/schemas/OrganizationType' }
            sector: { type: string, nullable: true }

    User:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        email: { type: string }
        phone: { type: string, nullable: true }
        role: { $ref: '#/components/schemas/Role' }
        isActive: { type: boolean }
        status: { $ref: '#/components/schemas/AccountStatus' }
        rejectReason: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        student:
          allOf: [{ $ref: '#/components/schemas/StudentProfile' }]
          nullable: true
        academicSupervisor:
          allOf: [{ $ref: '#/components/schemas/AcademicSupervisorProfile' }]
          nullable: true
        orgSupervisor:
          allOf: [{ $ref: '#/components/schemas/OrgSupervisorProfile' }]
          nullable: true

    CreateUserRequest:
      type: object
      required: [name, email, password, role]
      properties:
        name: { type: string, minLength: 2, example: Sara Ahmed }
        email: { type: string, format: email }
        password: { type: string, minLength: 8 }
        phone: { type: string, example: '0551234567' }
        role: { $ref: '#/components/schemas/Role' }
        universityId: { type: string, description: Required for STUDENT, example: '4400123' }
        major: { type: string, description: STUDENT }
        department: { type: string, description: ACADEMIC_SUPERVISOR }
        organizationId: { type: integer, description: Required for ORG_SUPERVISOR }
        position: { type: string, description: ORG_SUPERVISOR }

    StudentProfile:
      type: object
      properties:
        id: { type: integer }
        userId: { type: integer }
        universityId: { type: string }
        major: { type: string, nullable: true }
        gpa: { type: number, nullable: true }
    AcademicSupervisorProfile:
      type: object
      properties:
        id: { type: integer }
        userId: { type: integer }
        department: { type: string, nullable: true }
    OrgSupervisorProfile:
      type: object
      properties:
        id: { type: integer }
        userId: { type: integer }
        organizationId: { type: integer }
        position: { type: string, nullable: true }
        organization: { $ref: '#/components/schemas/Organization' }

    Organization:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        type: { $ref: '#/components/schemas/OrganizationType' }
        crNumber: { type: string, nullable: true, description: Commercial registration number }
        sector: { type: string, nullable: true }
        city: { type: string, nullable: true }
        contactEmail: { type: string, nullable: true }
        phone: { type: string, nullable: true }
    OrganizationInput:
      type: object
      properties:
        name: { type: string, description: Required on create }
        type: { $ref: '#/components/schemas/OrganizationType' }
        crNumber: { type: string, nullable: true }
        sector: { type: string, nullable: true }
        city: { type: string, nullable: true }
        contactEmail: { type: string, nullable: true }
        phone: { type: string, nullable: true }

    Opportunity:
      type: object
      properties:
        id: { type: integer }
        organizationId: { type: integer }
        title: { type: string }
        description: { type: string }
        type: { $ref: '#/components/schemas/OpportunityType' }
        seats: { type: integer }
        seatsTaken: { type: integer, description: APPROVED applications }
        seatsAvailable: { type: integer }
        applicationsCount: { type: integer }
        startDate: { type: string, format: date-time }
        endDate: { type: string, format: date-time }
        deadline: { type: string, format: date-time, nullable: true, description: Last day to apply }
        location: { type: string, nullable: true }
        target: { type: string, nullable: true, description: Target major / college }
        requirements: { type: string, nullable: true }
        status: { $ref: '#/components/schemas/OpportunityStatus' }
        createdAt: { type: string, format: date-time }
        organization: { $ref: '#/components/schemas/Organization' }
    CreateOpportunityRequest:
      type: object
      required: [title, description, seats, startDate, endDate]
      properties:
        organizationId: { type: integer, description: ADMIN only; ignored for ORG_SUPERVISOR }
        title: { type: string, example: Backend Developer Trainee }
        description: { type: string }
        type: { $ref: '#/components/schemas/OpportunityType' }
        seats: { type: integer, minimum: 1, example: 3 }
        startDate: { type: string, format: date, example: '2027-01-15' }
        endDate: { type: string, format: date, example: '2027-04-15' }
        deadline: { type: string, format: date, example: '2027-01-05', description: Last day to apply (optional) }
        location: { type: string, example: 'Najran, head office' }
        target: { type: string, example: Computer Science }
        requirements: { type: string }

    Application:
      type: object
      properties:
        id: { type: integer }
        studentId: { type: integer, description: "Student profile ID (not user ID)" }
        opportunityId: { type: integer }
        status: { $ref: '#/components/schemas/ApplicationStatus' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        student: { $ref: '#/components/schemas/StudentProfile' }
        opportunity: { $ref: '#/components/schemas/Opportunity' }

    Assignment:
      type: object
      properties:
        id: { type: integer }
        studentId: { type: integer }
        opportunityId: { type: integer }
        academicSupervisorId: { type: integer }
        orgSupervisorId: { type: integer }
        startDate: { type: string, format: date-time }
        endDate: { type: string, format: date-time }
        status: { $ref: '#/components/schemas/AssignmentStatus' }
        semester: { type: string, nullable: true, example: الفصل الأول }
        academicYear: { type: string, nullable: true, example: '1448' }
        commencementDate: { type: string, format: date, nullable: true, description: "Form (1): first day at the organization" }
        employedAfterTraining: { type: boolean, nullable: true }
        employerName: { type: string, nullable: true }
        employmentRecordedAt: { type: string, format: date-time, nullable: true }
        student:
          allOf: [{ $ref: '#/components/schemas/StudentProfile' }]
          description: Includes `user` with name and email
        opportunity: { $ref: '#/components/schemas/Opportunity' }
        academicSupervisor:
          allOf: [{ $ref: '#/components/schemas/AcademicSupervisorProfile' }]
          description: Includes `user` with name and email
        orgSupervisor:
          allOf: [{ $ref: '#/components/schemas/OrgSupervisorProfile' }]
          description: Includes `user` with name and email

    Attendance:
      type: object
      properties:
        id: { type: integer }
        assignmentId: { type: integer }
        date: { type: string, format: date }
        checkIn: { type: string, format: date-time, nullable: true }
        checkOut: { type: string, format: date-time, nullable: true }
        status: { $ref: '#/components/schemas/AttendanceStatus' }

    Report:
      type: object
      properties:
        id: { type: integer }
        assignmentId: { type: integer }
        type: { $ref: '#/components/schemas/ReportType' }
        title: { type: string }
        content: { type: string }
        weekNumber: { type: integer, nullable: true }
        attachment:
          allOf: [{ $ref: '#/components/schemas/Attachment' }]
          nullable: true
          description: Download with GET /attachments/{id}
        submittedById: { type: integer, description: User ID }
        status: { $ref: '#/components/schemas/ReportStatus' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    Note:
      type: object
      properties:
        id: { type: integer }
        assignmentId: { type: integer }
        supervisorId: { type: integer, description: User ID }
        note: { type: string }
        createdAt: { type: string, format: date-time }

    EvaluationCriterion:
      type: object
      properties:
        key: { type: string, example: attendance }
        label: { type: string, example: "الحضور والمواظبة في أوقات الدوام الرسمية" }
        max: { type: integer, example: 5 }

    EvaluationScores:
      type: object
      description: "One entry per criterion key: attendance, practical_application, ambition, cooperation, conduct, regulations, performance, tools"
      additionalProperties:
        type: object
        properties:
          score: { type: number, minimum: 0, maximum: 5 }
          notes: { type: string }
      example:
        attendance: { score: 5, notes: ممتاز }
        practical_application: { score: 4 }
        ambition: { score: 5 }
        cooperation: { score: 5 }
        conduct: { score: 5 }
        regulations: { score: 5 }
        performance: { score: 4 }
        tools: { score: 5 }

    CreateEvaluationRequest:
      type: object
      required: [assignmentId, scores, wouldHire]
      properties:
        assignmentId: { type: integer }
        scores: { $ref: '#/components/schemas/EvaluationScores' }
        wouldHire: { type: boolean, description: "هل ترغبون بتوظيف المتدرب بعد تخرجه؟" }
        noHireReason: { type: string, description: "Required when wouldHire is false" }
        comments: { type: string }
        evaluatorTitle: { type: string, description: المسمى الوظيفي }
        signature: { type: string, description: "Drawn signature as a PNG/JPEG data URL (max ~300 KB)", example: "data:image/png;base64,iVBOR..." }
        satisfaction: { type: integer, minimum: 1, maximum: 5, description: "Impact indicator — the organization's satisfaction with the cooperative-training programme" }

    Evaluation:
      type: object
      description: Shaped like the paper form, ready to render or print
      properties:
        id: { type: integer }
        assignmentId: { type: integer }
        semester: { type: string, nullable: true }
        academicYear: { type: string, nullable: true }
        trainee:
          type: object
          properties:
            name: { type: string }
            universityId: { type: string }
            major: { type: string, nullable: true }
        organization:
          type: object
          properties:
            id: { type: integer }
            name: { type: string }
        scores: { $ref: '#/components/schemas/EvaluationScores' }
        totalScore: { type: number, example: 37 }
        maxScore: { type: integer, example: 40 }
        wouldHire: { type: boolean }
        noHireReason: { type: string, nullable: true }
        comments: { type: string, nullable: true }
        satisfaction: { type: integer, nullable: true }
        signature: { type: string, nullable: true }
        evaluator:
          type: object
          properties:
            id: { type: integer }
            name: { type: string }
            jobTitle: { type: string, nullable: true }
        evaluatedAt: { type: string, format: date-time }

    FinalGrade:
      type: object
      properties:
        id: { type: integer }
        assignmentId: { type: integer }
        grade: { type: number }
        finalizedById: { type: integer, description: User ID }
        finalizedAt: { type: string, format: date-time }

    Notification:
      type: object
      properties:
        id: { type: integer }
        userId: { type: integer }
        message: { type: string }
        isRead: { type: boolean }
        createdAt: { type: string, format: date-time }

    AuditLog:
      type: object
      properties:
        id: { type: integer }
        userId: { type: integer, nullable: true }
        action: { type: string, example: USER_CREATED }
        entity: { type: string, example: User }
        entityId: { type: integer, nullable: true }
        meta: { type: object, nullable: true, additionalProperties: true }
        createdAt: { type: string, format: date-time }

    VisitStatus:
      type: string
      enum: [PENDING, APPROVED, DECLINED, CANCELLED]

    ContactInfo:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        email: { type: string }
        phone: { type: string, nullable: true }

    FieldVisit:
      type: object
      description: One row of the "الزيارات الميدانية" table
      properties:
        id: { type: integer }
        scheduledAt: { type: string, format: date-time, description: "Visit date and time" }
        status: { $ref: '#/components/schemas/VisitStatus' }
        requestMessage: { type: string }
        responseMessage: { type: string, nullable: true }
        respondedAt: { type: string, format: date-time, nullable: true }
        isDone: { type: boolean, description: "The Done checkbox" }
        doneAt: { type: string, format: date-time, nullable: true }
        notes: { type: string, nullable: true, description: "Academic supervisor's notes" }
        createdAt: { type: string, format: date-time }
        academicSupervisor:
          type: object
          properties:
            id: { type: integer }
            department: { type: string, nullable: true }
            user: { $ref: '#/components/schemas/ContactInfo' }
        orgSupervisor:
          type: object
          properties:
            id: { type: integer }
            position: { type: string, nullable: true }
            user: { $ref: '#/components/schemas/ContactInfo' }
            organization: { $ref: '#/components/schemas/Organization' }

    Attachment:
      type: object
      properties:
        id: { type: integer }
        originalName: { type: string, example: "نموذج الزيارات.pdf" }
        mimeType: { type: string, example: application/pdf }
        size: { type: integer, description: Bytes }
        createdAt: { type: string, format: date-time }

    Message:
      type: object
      properties:
        id: { type: integer }
        senderId: { type: integer }
        recipientId: { type: integer }
        subject: { type: string, nullable: true }
        body: { type: string }
        attachment:
          allOf: [{ $ref: '#/components/schemas/Attachment' }]
          nullable: true
        readAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }

    Person:
      type: object
      properties:
        id: { type: integer, description: User ID }
        name: { type: string }
        role: { $ref: '#/components/schemas/Role' }

    Contact:
      allOf:
        - $ref: '#/components/schemas/Person'
        - type: object
          properties:
            organizationName: { type: string, description: "Only for ORG_SUPERVISOR contacts of an academic supervisor" }

    Conversation:
      type: object
      properties:
        user: { $ref: '#/components/schemas/Person' }
        lastMessage: { $ref: '#/components/schemas/Message' }
        unreadCount: { type: integer }
