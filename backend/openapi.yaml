  /assignments:
    post:
      tags: [Assignments]
      summary: Create an assignment from an approved application
      description: |
        ✅ **Implemented**. **ADMIN only.**
        Links the student with an academic supervisor and an organization supervisor. Dates are copied from the opportunity.
        Rules: the application must be `APPROVED` (400); the organization supervisor must belong to the opportunity's organization (400);
        the student must not already have an ACTIVE assignment (409); the opportunity must have a free seat (409).
        The student and both supervisors are notified. Attendance, reports, notes, evaluations and the final grade all hang off the assignment.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [applicationId, academicSupervisorId, orgSupervisorId]
              properties:
                applicationId: { type: integer }
                academicSupervisorId: { type: integer, description: "ID from the academic supervisor profile (not the user ID)" }
                orgSupervisorId: { type: integer, description: "ID from the organization supervisor profile (not the user ID)" }
                semester: { type: string, example: الفصل الأول, description: "Printed on the evaluation form" }
                academicYear: { type: string, example: '1448', description: "Printed on the evaluation form" }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Assignment' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Student already has an active assignment, or no seats left
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    get:
      tags: [Assignments]
      summary: List assignments
      description: |
        ✅ **Implemented**. STUDENT sees their own; supervisors see the ones they supervise; ADMIN sees all.
      parameters:
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/AssignmentStatus' }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Paginated assignments
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Assignment' }
                  total: { type: integer }
                  page: { type: integer }
                  pages: { type: integer }
        '401': { $ref: '#/components/responses/Unauthorized' }

