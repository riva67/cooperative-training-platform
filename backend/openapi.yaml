openapi: 3.0.3
info:
  title: Cooperative Training Platform API
  version: 1.0.0
  description: |
    Backend API contract for the Cooperative Training Management Platform (project #45).

    **Base URL (local):** `http://localhost:4000`

    **Authentication:** call `POST /auth/login`, copy the `token`, then click **Authorize** and paste it.
    Every other endpoint (except `/health`, `/auth/register` and `/auth/login`) needs the header `Authorization: Bearer <token>`.

    **Roles:** `STUDENT`, `ACADEMIC_SUPERVISOR`, `ORG_SUPERVISOR`, `ADMIN`. ADMIN can access everything.

    **Status labels** in each endpoint description:
    - ✅ **Implemented**: already working in the backend.

    **Errors** always look like `{ "error": "message" }`. Validation errors (400) also include `details`.
    A refused login of an account that is not active also includes `code`: `PENDING`, `REJECTED` (+ `reason`) or `SUSPENDED`.

    **Account approval:** students are active immediately after `POST /auth/register`. Academic supervisors and
    training providers are created with `status: PENDING` and cannot log in until an admin approves them
    (`PATCH /users/{id}/active` with `isActive: true`) or rejects them (`POST /users/{id}/reject`).

    **Test accounts** (password for all: `Password123!`): `admin@coop.test`, `student@coop.test`, `academic@coop.test`, `company@coop.test`.
servers:
  - url: http://localhost:4000
    description: Local development
tags:
  - name: Auth
    description: Login and current user
  - name: Users
    description: Account and permissions management (admin only)
  - name: Organizations
    description: Training organizations (جهات التدريب) and their type (PRIVATE / EDUCATIONAL / GOVERNMENT)
  - name: Opportunities
    description: Training opportunities posted by organizations
  - name: Applications
    description: Student applications and nomination/approval flow
  - name: Assignments
    description: A confirmed training placement linking student, organization and supervisors
  - name: Attendance
    description: Student check-in / check-out
  - name: Reports
    description: Training reports and approval reports
  - name: Supervision
    description: Academic supervisor monitoring, notes, evaluations, final grade
  - name: Visits
    description: Field visits booked by the academic supervisor and approved by the training organization
  - name: Messages
    description: Chat and email-style messages with attachments between supervisors, students and organizations
  - name: Notifications
    description: In-app notifications
  - name: Statistics
    description: Impact indicators for dashboards
  - name: System
    description: Health check and audit logs

security:
  - bearerAuth: []

paths:
  /auth/register:
    post:
      tags: [Auth]
      summary: Create an account (sign-up form)
      description: |
        ✅ **Implemented**. Public. Rate-limited per IP.
        - `STUDENT`: active immediately; the response contains a `token`.
        - `ACADEMIC_SUPERVISOR` (مشرف) and `ORG_SUPERVISOR` (جهة تدريبية): created with `status: PENDING`, no token.
          They can log in after an admin approves them. If `SUPERVISOR_EMAIL_DOMAIN` is set in `.env`, academic supervisors
          must use that e-mail domain.
        - `ADMIN` can never self-register.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  title: Student
                  required: [role, name, email, password, universityId]
                  properties:
                    role: { type: string, enum: [STUDENT] }
                    name: { type: string }
                    email: { type: string, format: email }
                    phone: { type: string }
                    password: { type: string, minLength: 8 }
                    universityId: { type: string, example: '446300179' }
                    major: { type: string }
                - type: object
                  title: Academic supervisor (مشرف)
                  required: [role, name, email, password, department]
                  properties:
                    role: { type: string, enum: [ACADEMIC_SUPERVISOR] }
                    name: { type: string, description: الاسم الكامل }
                    department: { type: string, description: الكلية / القسم }
                    email: { type: string, format: email }
                    phone: { type: string, description: رقم الجوال }
                    password: { type: string, minLength: 8 }
                - type: object
                  title: Training provider (جهة تدريبية)
                  required: [role, name, email, password, organizationName, organizationType]
                  properties:
                    role: { type: string, enum: [ORG_SUPERVISOR] }
                    name: { type: string }
                    email: { type: string, format: email }
                    phone: { type: string }
                    password: { type: string, minLength: 8 }
                    organizationName: { type: string }
                    organizationType: { $ref: '#/components/schemas/OrganizationType' }
                    organizationSubtype: { type: string, description: "Second dropdown (شركة، مصنع، جامعة أهلية، وزارة ...), stored in Organization.sector" }
                    crNumber: { type: string, description: "Commercial registration number; optional (government and educational bodies have none). Must be unique." }
                    position: { type: string }
      responses:
        '201':
          description: Created. `pending` tells the frontend whether to show "waiting for approval" or log the user in.
          content:
            application/json:
              schema:
                type: object
                properties:
                  pending: { type: boolean }
                  token: { type: string, description: Only when pending is false }
                  message: { type: string, description: Only when pending is true }
                  user: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '409':
          description: Email, university ID or CR number already registered
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429':
          description: Too many sign-up attempts

  /health:
    get:
      tags: [System]
      summary: Health check
      description: "✅ **Implemented**. Public."
      security: []
      responses:
        '200':
          description: Server is running
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
                  time: { type: string, format: date-time }

  /auth/login:
    post:
      tags: [Auth]
      summary: Log in
      description: "✅ **Implemented**. Public. Returns a JWT valid for 1 day. Rate-limited per IP (429 after too many attempts)."
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email, example: admin@coop.test }
                password: { type: string, example: Password123! }
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
                  user:
                    $ref: '#/components/schemas/AuthUser'
        '400': { $ref: '#/components/responses/ValidationError' }
        '429':
          description: Too many login attempts
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: Wrong email/password
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: Correct password but the account is not active
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string }
                  code: { type: string, enum: [PENDING, REJECTED, SUSPENDED] }
                  reason: { type: string, nullable: true, description: Rejection reason (REJECTED only) }

  /auth/me:
    get:
      tags: [Auth]
      summary: Current user with role profile
      description: "✅ **Implemented**. Any logged-in user. Only the profile matching the user's role is non-null."
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/AuthUser'
                  - type: object
                    properties:
                      createdAt: { type: string, format: date-time }
                      phone: { type: string, nullable: true }
                      student:
                        allOf: [{ $ref: '#/components/schemas/StudentProfile' }]
                        nullable: true
                      academicSupervisor:
                        allOf: [{ $ref: '#/components/schemas/AcademicSupervisorProfile' }]
                        nullable: true
                      orgSupervisor:
                        allOf: [{ $ref: '#/components/schemas/OrgSupervisorProfile' }]
                        nullable: true
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/password:
    patch:
      tags: [Auth]
      summary: Change my password
      description: "✅ **Implemented**. Any logged-in user."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                currentPassword: { type: string }
                newPassword: { type: string, minLength: 8 }
      responses:
        '200':
          description: Password updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string, example: Password updated }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/profile:
    patch:
      tags: [Auth]
      summary: Update my name / phone
      description: "✅ **Implemented**. Any logged-in user. The phone number is shown in the field-visits table."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, minLength: 2 }
                phone: { type: string, example: '+966 55 123 4567', description: "Digits, spaces, + and - only (5–20 chars)" }
      responses:
        '200':
          description: Updated profile
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: integer }
                  name: { type: string }
                  email: { type: string }
                  phone: { type: string, nullable: true }
                  role: { $ref: '#/components/schemas/Role' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /users:
    post:
      tags: [Users]
      summary: Create an account
      description: |
        ✅ **Implemented**. **ADMIN only.**
        Required extra fields by role: `STUDENT` needs `universityId`; `ORG_SUPERVISOR` needs `organizationId`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateUserRequest' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: Email or university ID already exists
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    get:
      tags: [Users]
      summary: List users
      description: "✅ **Implemented**. **ADMIN only.**"
      parameters:
        - name: role
          in: query
          schema: { $ref: '#/components/schemas/Role' }
        - name: search
          in: query
          description: Matches name or email (case-insensitive)
          schema: { type: string }
        - name: status
          in: query
          description: "`PENDING` = registration requests waiting for approval"
          schema: { $ref: '#/components/schemas/AccountStatus' }
        - name: isActive
          in: query
          schema: { type: string, enum: ['true', 'false'] }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Paginated users
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/User' }
                  total: { type: integer }
                  page: { type: integer }
                  pages: { type: integer }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /users/{id}:
    get:
      tags: [Users]
      summary: Get one user with profile
      description: "✅ **Implemented**. **ADMIN only.**"
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: User
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /users/{id}/role:
    patch:
      tags: [Users]
      summary: Change a user's role (permissions management)
      description: "✅ **Implemented**. **ADMIN only.** You cannot change your own role. Changing to STUDENT or ORG_SUPERVISOR requires the user to already have that profile (400 otherwise); an academic-supervisor profile is created automatically."
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role: { $ref: '#/components/schemas/Role' }
      responses:
        '200':
          description: Updated user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /users/{id}/active:
    patch:
      tags: [Users]
      summary: Approve / enable or disable an account
      description: "✅ **Implemented**. **ADMIN only.** `isActive: true` approves a PENDING request (status ACTIVE); `false` disables (status SUSPENDED). You cannot disable your own account."
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [isActive]
              properties:
                isActive: { type: boolean }
      responses:
        '200':
          description: Updated user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /users/{id}/reject:
    post:
      tags: [Users]
      summary: Reject a registration request
      description: "✅ **Implemented**. **ADMIN only.** Only for PENDING academic-supervisor / training-provider requests. A provider's CR number is released."
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string, maxLength: 500 }
      responses:
        '200':
          description: Rejected user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /organizations:
    get:
      tags: [Organizations]
      summary: List organizations
      description: "✅ **Implemented**. Any logged-in user."
      parameters:
        - name: type
          in: query
          schema: { $ref: '#/components/schemas/OrganizationType' }
        - name: search
          in: query
          schema: { type: string }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Paginated organizations (with `_count.opportunities` and `_count.supervisors`)
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Organization' }
                  total: { type: integer }
                  page: { type: integer }
                  pages: { type: integer }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Organizations]
      summary: Create an organization
      description: "✅ **Implemented**. **ADMIN only.** Then add supervisors with `POST /users` (role ORG_SUPERVISOR + organizationId)."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrganizationInput' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Organization' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: CR number already exists

  /organizations/{id}:
    get:
      tags: [Organizations]
      summary: Get one organization with its active supervisors
      description: "✅ **Implemented**. Any logged-in user."
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Organization
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Organization' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Organizations]
      summary: Update an organization
      description: "✅ **Implemented**. **ADMIN, or an ORG_SUPERVISOR of that organization** (the CR number can only be changed by ADMIN). Send only the fields to change."
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrganizationInput' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Organization' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /opportunities:
    get:
      tags: [Opportunities]
      summary: List training opportunities
      description: "✅ **Implemented**. Any logged-in user."
      parameters:
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/OpportunityStatus' }
        - name: type
          in: query
          schema: { $ref: '#/components/schemas/OpportunityType' }
        - name: organizationId
          in: query
          schema: { type: integer }
        - name: organizationType
          in: query
          description: Only opportunities of PRIVATE / EDUCATIONAL / GOVERNMENT organizations
          schema: { $ref: '#/components/schemas/OrganizationType' }
        - name: mine
          in: query
          description: "ORG_SUPERVISOR only: `true` = only my organization's opportunities"
          schema: { type: string, enum: ['true', 'false'] }
        - name: search
          in: query
          description: Matches title or description
          schema: { type: string }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Paginated opportunities
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Opportunity' }
                  total: { type: integer }
                  page: { type: integer }
                  pages: { type: integer }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Opportunities]
      summary: Create an opportunity
      description: |
        ✅ **Implemented**. **ORG_SUPERVISOR or ADMIN.**
        For an ORG_SUPERVISOR the organization is taken from their profile. ADMIN must send `organizationId`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateOpportunityRequest' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Opportunity' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /opportunities/summary:
    get:
      tags: [Opportunities]
      summary: Seats overview of my organization (المقاعد التدريبية)
      description: "✅ **Implemented**. **ORG_SUPERVISOR** (own organization) or ADMIN (all). Seat numbers count OPEN opportunities; a seat is taken by each APPROVED application."
      responses:
        '200':
          description: Totals
          content:
            application/json:
              schema:
                type: object
                properties:
                  opportunities: { type: integer }
                  openOpportunities: { type: integer }
                  totalSeats: { type: integer }
                  seatsTaken: { type: integer }
                  seatsAvailable: { type: integer }
                  applications: { type: integer }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /opportunities/{id}:
    get:
      tags: [Opportunities]
      summary: Get one opportunity
      description: "✅ **Implemented**. Any logged-in user."
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Opportunity with organization
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Opportunity' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Opportunities]
      summary: Update or close an opportunity
      description: "✅ **Implemented**. **ORG_SUPERVISOR (own organization) or ADMIN.** Send only the fields to change."
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string }
                description: { type: string }
                type: { $ref: '#/components/schemas/OpportunityType' }
                seats: { type: integer, minimum: 1, description: Cannot be lower than the students already approved }
                startDate: { type: string, format: date }
                endDate: { type: string, format: date }
                deadline: { type: string, format: date, nullable: true }
                location: { type: string, nullable: true }
                target: { type: string, nullable: true }
                requirements: { type: string, nullable: true }
                status: { $ref: '#/components/schemas/OpportunityStatus' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Opportunity' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

    delete:
      tags: [Opportunities]
      summary: Delete an opportunity
      description: "✅ **Implemented**. **ORG_SUPERVISOR (own organization) or ADMIN.** Only while nobody has applied; otherwise 409 — close it with `PATCH status=CLOSED` instead."
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '204':
          description: Deleted
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Students already applied

  /applications:
    post:
      tags: [Applications]
      summary: Apply to an opportunity
      description: |
        ✅ **Implemented**. **STUDENT only.**
        Returns 409 if the student already applied, and 400 if the opportunity is closed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [opportunityId]
              properties:
                opportunityId: { type: integer, example: 1 }
      responses:
        '201':
          description: Application created with status PENDING
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Application' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: Already applied
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    get:
      tags: [Applications]
      summary: List applications
      description: |
        ✅ **Implemented**. Results depend on the role:
        STUDENT sees their own; ORG_SUPERVISOR sees applications to their organization; ACADEMIC_SUPERVISOR and ADMIN see all.
      parameters:
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/ApplicationStatus' }
        - name: opportunityId
          in: query
          schema: { type: integer }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Paginated applications (each includes `student` and `opportunity`)
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Application' }
                  total: { type: integer }
                  page: { type: integer }
